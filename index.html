<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숏폼 생성기 · Shortform Generator</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1>숏폼 생성기 <span class="sub">Shortform Generator</span></h1>
    <p class="tagline">유튜브 쇼츠형 9:16 · 자막/댓글이 시간대별로 바뀌는 영상(webm)까지 출력.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-label="편집">
      <fieldset>
        <legend>배경 / 채널</legend>
        <div class="field"><label for="imageInput">배경 이미지</label><input type="file" id="imageInput" accept="image/*" /></div>
        <div class="field"><label for="videoInput">배경 영상 (선택 · 영상 출력용)</label><input type="file" id="videoInput" accept="video/*" /></div>
        <div class="field"><label for="videoUrl">또는 영상 URL 붙여넣기</label><input type="text" id="videoUrl" value="https://d8j0ntlcm91z4.cloudfront.net/clipify/user_3GGxhx3yZPT98lExXt1zuaqZTRm/oQnwGnGYc78/a7e7d013-5f92-4ce3-96c6-d1ac332e8ecc/clips/clip_01.mp4" /><button type="button" id="loadUrlBtn" class="secondary" style="width:100%;margin-top:8px">URL에서 영상 불러오기</button><div id="urlStatus" style="font-size:12px;color:#9aa0aa;margin-top:6px"></div></div>
        <div class="field"><label for="avatarInput">채널 로고 (선택)</label><input type="file" id="avatarInput" accept="image/*" /></div>
        <div class="field"><label for="handle">채널 ID</label><input type="text" id="handle" value="@todays_econ" /></div>
        <div class="field"><label for="channelName">채널명</label><input type="text" id="channelName" value="오늘의경제학" /></div>
        <div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="overlayHeader" style="width:auto" /> 헤더로 원본 상단 덮기 (예능바다 가리기)</label></div>
        <div class="field"><label for="headerHeight">헤더 높이(px) — 덮기 조절용</label><input type="text" id="headerHeight" value="150" /></div>
      </fieldset>

      <fieldset>
        <legend>상단 제목 (상시)</legend>
        <div class="field"><label for="titleLine1">1줄</label><input type="text" id="titleLine1" value="" placeholder="(비워두면 헤더가 작아집니다)" /></div>
        <div class="field"><label for="titleLine2">2줄</label><input type="text" id="titleLine2" value="" /></div>
      </fieldset>

      <fieldset>
        <legend>상단 라벨 (타임드)</legend>
        <div class="field"><label for="labelHi">빨강 강조</label><input type="text" id="labelHi" value="" /></div>
        <div class="field"><label for="labelRest">나머지</label><input type="text" id="labelRest" value="" /></div>
        <div class="row">
          <div class="field"><label for="labelStart">시작(초)</label><input type="text" id="labelStart" value="0.5" /></div>
          <div class="field"><label for="labelEnd">끝(초)</label><input type="text" id="labelEnd" value="8" /></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>자막 큐 (시작,끝,문구 · 줄바꿈 구분)</legend>
        <div class="field">
          <textarea id="subtitleCues" rows="4" placeholder="클립에 이미 자막이 있으면 비워두세요. 예) 0,3,첫 자막"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>댓글 카드 (타임드)</legend>
        <div class="field"><label for="commentUser">유저</label><input type="text" id="commentUser" value="" /></div>
        <div class="field"><label for="commentTime">시간</label><input type="text" id="commentTime" value="7개월 전" /></div>
        <div class="field"><label for="commentText">댓글 내용</label><input type="text" id="commentText" value="" placeholder="(비워두면 댓글 카드 숨김)" /></div>
        <div class="field"><label for="commentLikes">좋아요 수</label><input type="text" id="commentLikes" value="2만" /></div>
        <div class="row">
          <div class="field"><label for="commentStart">시작(초)</label><input type="text" id="commentStart" value="4" /></div>
          <div class="field"><label for="commentEnd">끝(초)</label><input type="text" id="commentEnd" value="8" /></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>출처 / 길이</legend>
        <div class="field"><label for="source">출처 캡션 (상시)</label><input type="text" id="source" value="" placeholder="(선택) 출처 표기" /></div>
        <div class="field"><label for="duration">영상 길이(초)</label><input type="text" id="duration" value="8" /></div>
      </fieldset>

      <div class="actions">
        <button id="playBtn" type="button" class="secondary">▶ 재생 미리보기</button>
        <button id="recordBtn" type="button" class="secondary">● 영상 녹화 (webm)</button>
        <button id="downloadBtn" type="button">PNG 내보내기</button>
      </div>
    </section>

    <section class="preview" aria-label="미리보기">
      <canvas id="canvas" width="1080" height="1920"></canvas>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
