<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>썰 슬라이드 숏폼 생성기 (자동 자막 + 이미지 분리)</title>
<style>
  :root{--bg:#0e0f13;--panel:#191b21;--border:#2a2e38;--text:#e8eaed;--muted:#9aa0aa;--accent:#ffd400;--accent-ink:#14161b;--info:#4da3ff;--input-bg:#101319;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 56px;}
  header h1{margin:0;font-size:22px;}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px;}
  .layout{display:grid;grid-template-columns:440px 1fr;gap:24px;margin-top:20px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;}
  fieldset{border:1px solid var(--border);border-radius:10px;margin:0 0 14px;padding:12px 14px 4px;}
  legend{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 6px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  input[type="text"],input[type="password"],input[type="file"],textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .slot{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--input-bg);}
  .slot .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;}
  .slot .thumb{width:100%;height:64px;object-fit:cover;border-radius:7px;margin-bottom:6px;display:none;border:1px solid var(--border);}
  button{cursor:pointer;font-family:inherit;}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btns button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:15px;}
  .primary{background:var(--accent);color:var(--accent-ink);}
  .secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .secondary:hover{border-color:var(--accent);}
  button:disabled{opacity:.5;cursor:default;}
  .fetchbtn{background:var(--info);color:#fff;border:none;border-radius:9px;padding:9px;width:100%;font-weight:700;font-size:14px;margin-bottom:8px;}
  .sbtn{background:transparent;border:1px solid var(--info);color:var(--info);border-radius:7px;padding:5px 10px;font-size:12px;}
  .preview{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #canvas{width:100%;max-width:360px;aspect-ratio:9/16;height:auto;border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.4);background:#000;}
  .nav{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;}
  .nav button{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;}
  .hint{font-size:12px;color:var(--muted);margin:4px 2px 0;}
  #status{font-size:13px;color:var(--accent);min-height:18px;margin:6px 2px;}
  a{color:var(--info);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>썰 슬라이드 숏폼 생성기 <span style="font-size:13px;color:var(--muted)">· 자동 자막 + 이미지 분리</span></h1>
    <p>음성을 넣으면 자막이 자동으로(빠른 1줄) 생기고, 이미지는 원하는 개수만 넣습니다. 내 컴퓨터에서 직접 열어야 동작해요.</p>
  </header>
  <div class="layout">
    <section class="panel">
      <fieldset>
        <legend>상단 제목 바</legend>
        <div class="field"><label for="titleLine1">1줄 (흰색)</label><input type="text" id="titleLine1" value="아빠가 월600" /></div>
        <div class="field"><label for="titleLine2">2줄 (노란 강조)</label><input type="text" id="titleLine2" value="벌어도 가난한 이유" /></div>
      </fieldset>

      <fieldset>
        <legend>음성 &amp; 자동 자막</legend>
        <div class="field"><label for="audioInput">나레이션 음성 (mp3 등)</label><input type="file" id="audioInput" accept="audio/*" /></div>
        <button type="button" class="fetchbtn" id="transcribeBtn">🎙️ ① 음성에서 자막 자동 생성 (AI · 타이밍 추출)</button>
        <p class="hint">말한 내용을 인식해 <b>타이밍</b>을 잡습니다. 처음 1회만 AI 모델(약 150MB) 다운로드. (인터넷·크롬 권장)</p>
        <div class="field" style="margin-top:10px"><label for="scriptBox">② 정확한 대본 붙여넣기 (오타 없는 원본)</label><textarea id="scriptBox" rows="4" placeholder="여기에 정확한 대본 전체를 붙여넣으세요"></textarea></div>
        <button type="button" class="fetchbtn" id="applyScript" style="background:transparent;border:1px solid var(--accent);color:var(--accent)">📝 ③ 대본으로 자막 맞추기 (음성 타이밍 유지)</button>
        <p class="hint">Whisper의 타이밍은 그대로 두고, 글자만 내 대본으로 바꿔 오타를 없앱니다.</p>
        <div class="field" style="margin-top:10px"><label for="subsBox">자막 결과 (한 줄 = 자막 하나 · 직접 수정 가능)</label><textarea id="subsBox" rows="5" placeholder="①→③ 하면 여기에 채워집니다"></textarea></div>
        <div id="subsInfo" class="hint"></div>
      </fieldset>

      <fieldset>
        <legend>이미지 (개수 지정)</legend>
        <div class="row">
          <div class="field"><label for="imgCount">이미지 개수</label><input type="text" id="imgCount" value="8" /></div>
          <div class="field"><label>&nbsp;</label><button type="button" class="secondary" id="buildSlots" style="width:100%;padding:9px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700">이 개수로 칸 만들기</button></div>
        </div>
        <div id="slotInfo" class="hint" style="margin-bottom:8px"></div>
        <div id="slots"></div>
      </fieldset>

      <fieldset>
        <legend>이미지 채우기</legend>
        <div class="field"><label for="imgUrls">AI 생성 이미지 URL — 한 줄에 하나 (순서대로)</label><textarea id="imgUrls" rows="3" placeholder="Claude가 준 나노바나나 이미지 URL"></textarea></div>
        <button type="button" class="fetchbtn" id="applyUrls">🖼️ URL 목록으로 이미지 채우기</button>
        <div class="field" style="margin-top:8px"><label for="pixKey">또는 픽사베이 API 키 (<a href="https://pixabay.com/api/docs/" target="_blank">발급</a>)</label><input type="password" id="pixKey" placeholder="픽사베이로 자동 검색하려면 키 입력" /></div>
        <button type="button" class="fetchbtn" id="fetchAll" style="background:transparent;border:1px solid var(--info);color:var(--info)">🔍 픽사베이로 전체 채우기</button>
      </fieldset>

      <fieldset>
        <legend>하단 채널명</legend>
        <div class="field"><input type="text" id="channelName" value="오늘의경제학" /></div>
      </fieldset>

      <div id="status"></div>
      <div class="btns">
        <button type="button" class="secondary" id="playBtn">▶ 재생 미리보기</button>
        <button type="button" class="primary" id="recordBtn">💾 영상 저장</button>
        <button type="button" class="secondary" id="pngBtn">현재 화면 이미지 저장 (PNG)</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="nav">
        <button type="button" id="prev">◀</button>
        <span id="navLabel">이미지 0 / 0</span>
        <button type="button" id="next">▶</button>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";
  var W=1080,H=1920,TOP=360,BOT=300,MIDBOT=H-BOT;
  var canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
  var $=function(id){return document.getElementById(id);};
  var subs=[];         // [{start,end,text}]
  var imgSlots=[];     // [{el,img,query()}]
  var audioEl=null, actx=null, audioFile=null, rawChunks=[];
  var previewIdx=0, playing=false, exporting=false;

  try{var k=localStorage.getItem("pixKey"); if(k)$("pixKey").value=k;}catch(e){}
  $("pixKey").addEventListener("input",function(){try{localStorage.setItem("pixKey",$("pixKey").value.trim());}catch(e){}});

  function num(el,d){var v=parseFloat(el.value);return isNaN(v)?d:v;}
  function status(m){$("status").textContent=m;}
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawContain(img,bx,by,bw,bh){var iw=img.width,ih=img.height;if(!iw||!ih)return;var r=Math.min(bw/iw,bh/ih),w=iw*r,h=ih*r;ctx.drawImage(img,bx+(bw-w)/2,by+(bh-h)/2,w,h);}

  // 자막: 검정 바탕 + 노란 글씨, 1줄
  function captionBar(text,bottomY){
    if(!text)return;
    ctx.font="800 56px system-ui, sans-serif"; ctx.textAlign="center";
    var padX=28,padY=16,lh=64, tw=ctx.measureText(text).width;
    var bw=Math.min(tw+padX*2,W-40), bh=lh+padY*2, bx=(W-bw)/2, by=bottomY-bh;
    ctx.fillStyle="rgba(0,0,0,0.85)"; roundRect(bx,by,bw,bh,12); ctx.fill();
    ctx.fillStyle="#ffe000"; ctx.fillText(text,W/2,by+padY+lh*0.72);
  }

  function totalDur(){
    if(audioEl&&isFinite(audioEl.duration)&&audioEl.duration>0)return audioEl.duration;
    if(subs.length)return subs[subs.length-1].end;
    return 60;
  }
  function activeSub(t){ for(var i=0;i<subs.length;i++){ if(t>=subs[i].start&&t<subs[i].end)return subs[i].text; } return ""; }
  function activeImg(t){ var N=imgSlots.length; if(!N)return null; var sd=totalDur()/N; var idx=Math.floor(t/sd); if(idx<0)idx=0; if(idx>=N)idx=N-1; return imgSlots[idx].img; }

  function renderAt(t){
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    // 제목
    ctx.fillStyle="#000000"; ctx.fillRect(0,0,W,TOP);
    var t1=$("titleLine1").value.trim(), t2=$("titleLine2").value.trim();
    ctx.textAlign="center"; ctx.font="800 80px system-ui, sans-serif";
    ctx.fillStyle="#ffffff"; if(t1)ctx.fillText(t1,W/2,224);
    if(t2){var tw=ctx.measureText(t2).width,bw=tw+44,bx=(W-bw)/2;ctx.fillStyle="#ffe000";roundRect(bx,258,bw,92,12);ctx.fill();ctx.fillStyle="#111";ctx.fillText(t2,W/2,324);}
    // 이미지
    var imgTop=TOP+20, imgBot=MIDBOT-20, img=activeImg(t);
    if(img){ drawContain(img,70,imgTop,W-140,imgBot-imgTop); }
    else if(!exporting){ ctx.textAlign="center";ctx.fillStyle="#e3e6ea";ctx.font="500 34px system-ui, sans-serif";ctx.fillText("(이미지 없음 · 저장 가능)",W/2,(imgTop+imgBot)/2); }
    // 자막(1줄)
    captionBar(activeSub(t), MIDBOT-30);
    // 하단 채널
    ctx.fillStyle="#000000"; ctx.fillRect(0,MIDBOT,W,BOT);
    ctx.textAlign="left"; ctx.fillStyle="#ffffff"; ctx.font="700 44px system-ui, sans-serif";
    ctx.fillText($("channelName").value.trim(),44,MIDBOT+76);
  }

  function renderPreview(){
    var N=imgSlots.length;
    if(!N){ renderAt(0); $("navLabel").textContent="이미지 0 / 0"; return; }
    if(previewIdx>=N)previewIdx=N-1; if(previewIdx<0)previewIdx=0;
    var sd=totalDur()/N, t=(previewIdx+0.5)*sd;
    renderAt(t);
    $("navLabel").textContent="이미지 "+(previewIdx+1)+" / "+N;
  }

  // ---- 이미지 칸 ----
  function buildSlots(){
    var N=Math.max(1,Math.round(num($("imgCount"),8)));
    var old=imgSlots.map(function(s){return s.img;});
    $("slots").innerHTML=""; imgSlots=[];
    for(var i=0;i<N;i++){ addSlot(old[i]||null); }
    var sd=(totalDur()/N);
    $("slotInfo").textContent="이미지 "+N+"칸 · 각 약 "+sd.toFixed(1)+"초씩 (총 "+Math.round(totalDur())+"초)";
    previewIdx=0; renderPreview();
  }
  function addSlot(existingImg){
    var idx=imgSlots.length;
    var el=document.createElement("div"); el.className="slot";
    el.innerHTML='<div class="shead"><b>이미지 '+(idx+1)+'</b></div>'+
      '<img class="thumb" />'+
      '<div class="field"><input type="file" accept="image/*" class="s-img"></div>'+
      '<div class="field"><input type="text" class="s-q" placeholder="검색어(픽사베이용·영어 권장)"></div>'+
      '<button type="button" class="sbtn">이 칸만 픽사베이 검색</button>';
    $("slots").appendChild(el);
    var obj={el:el,img:existingImg||null,query:function(){return el.querySelector(".s-q").value.trim();},
      setImg:function(im){obj.img=im;var th=el.querySelector(".thumb");th.src=im.src;th.style.display="block";renderPreview();}};
    if(existingImg){var th=el.querySelector(".thumb");th.src=existingImg.src;th.style.display="block";}
    el.querySelector(".s-img").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var im=new Image();im.onload=function(){obj.setImg(im);};im.src=URL.createObjectURL(f);});
    el.querySelector(".sbtn").addEventListener("click",function(){fetchForSlot(obj);});
    imgSlots.push(obj);
  }

  // ---- 픽사베이 ----
  function pixabaySearch(q){
    var key=$("pixKey").value.trim(); if(!key)return Promise.reject(new Error("NO_KEY"));
    var url="https://pixabay.com/api/?key="+encodeURIComponent(key)+"&q="+encodeURIComponent(q)+"&image_type=photo&orientation=vertical&per_page=8&safesearch=true&order=popular&lang=ko";
    return fetch(url).then(function(r){if(!r.ok)throw new Error("API_"+r.status);return r.json();}).then(function(j){if(!j.hits||!j.hits.length)return null;return j.hits[0].largeImageURL||j.hits[0].webformatURL;});
  }
  function loadImage(u){
    return fetch(u).then(function(r){return r.blob();}).then(function(b){var ou=URL.createObjectURL(b);return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=ou;});})
      .catch(function(){return new Promise(function(res,rej){var im=new Image();im.crossOrigin="anonymous";im.onload=function(){res(im);};im.onerror=rej;im.src=u;});});
  }
  function fetchForSlot(obj){
    var q=obj.query(); if(!q){status("이 칸의 검색어를 입력하세요(영어 권장).");return Promise.resolve();}
    status("'"+q+"' 검색중..."); return pixabaySearch(q).then(function(url){if(!url){status("'"+q+"' 결과 없음");return;}return loadImage(url).then(function(im){obj.setImg(im);status("완료: "+q);});})
      .catch(function(e){status(e.message==="NO_KEY"?"픽사베이 API 키를 입력하세요.":"오류: "+e.message);});
  }
  function fetchAll(){
    if(!imgSlots.length){status("먼저 이미지 칸을 만드세요.");return;}
    var i=0;(function next(){ if(i>=imgSlots.length){status("픽사베이 채우기 완료");return;} status("("+(i+1)+"/"+imgSlots.length+") 검색중..."); fetchForSlot(imgSlots[i]).then(function(){i++;setTimeout(next,300);}); })();
  }
  function applyUrls(){
    var urls=$("imgUrls").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
    if(!imgSlots.length){status("먼저 '이 개수로 칸 만들기'를 누르세요.");return;}
    if(!urls.length){status("붙여넣은 URL이 없습니다.");return;}
    var i=0;(function next(){ if(i>=urls.length||i>=imgSlots.length){status("이미지 URL 적용 완료 ✅");return;} status("("+(i+1)+") 로딩..."); loadImage(urls[i]).then(function(im){imgSlots[i].setImg(im);i++;setTimeout(next,150);}).catch(function(e){status("일부 실패("+(i+1)+"): "+e.message);i++;setTimeout(next,150);}); })();
  }

  // ---- 오디오 & Whisper ----
  function fmt(s){s=Math.round(s);return Math.floor(s/60)+"분 "+(s%60)+"초";}
  function updateInfo(){ if(imgSlots.length){var sd=totalDur()/imgSlots.length;$("slotInfo").textContent="이미지 "+imgSlots.length+"칸 · 각 약 "+sd.toFixed(1)+"초 (총 "+Math.round(totalDur())+"초)";} }
  $("audioInput").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(!f)return;audioFile=f;audioEl=new Audio();audioEl.src=URL.createObjectURL(f);audioEl._wired=false;audioEl.addEventListener("loadedmetadata",function(){updateInfo();renderPreview();});});

  function splitPieces(text,max){
    var words=text.split(" "),groups=[],cur="";
    words.forEach(function(w){ if((cur+" "+w).trim().length>max&&cur){groups.push(cur.trim());cur=w;} else cur=(cur+" "+w).trim(); });
    if(cur)groups.push(cur.trim());
    return groups.length?groups:[text];
  }
  function buildSubs(out){
    var raw=out.chunks||[], res=[], max=12;
    raw.forEach(function(c){
      var s=(c.timestamp&&c.timestamp[0])||0, e=(c.timestamp&&c.timestamp[1])||(s+1.2);
      var txt=(c.text||"").replace(/\s+/g," ").trim(); if(!txt)return;
      var groups=splitPieces(txt,max), d=(e-s)/groups.length;
      groups.forEach(function(g,i){res.push({start:s+i*d,end:s+(i+1)*d,text:g});});
    });
    return res;
  }
  // 정확한 대본을 Whisper 타이밍에 맞춰 배치 (오타 제거, 타이밍 유지)
  function applyScript(){
    if(!rawChunks.length){status("먼저 ① 음성에서 자막 생성을 눌러 타이밍을 만드세요.");return;}
    var correct=$("scriptBox").value.replace(/\s+/g," ").trim();
    if(!correct){status("② 정확한 대본을 붙여넣으세요.");return;}
    var words=correct.split(" "), totalW=words.length;
    var R=rawChunks.reduce(function(a,c){return a+(((c.text||"").replace(/\s+/g,"").length)||1);},0);
    var out=[], wi=0;
    for(var i=0;i<rawChunks.length;i++){
      var c=rawChunks[i];
      var s=(c.timestamp&&c.timestamp[0])||0, e=(c.timestamp&&c.timestamp[1])||(s+1.2);
      var frac=(((c.text||"").replace(/\s+/g,"").length)||1)/R;
      var wc=(i===rawChunks.length-1)?(totalW-wi):Math.round(totalW*frac);
      wc=Math.min(Math.max(0,wc),Math.max(0,totalW-wi));
      var slice=words.slice(wi,wi+wc).join(" ").trim(); wi+=wc;
      if(!slice)continue;
      var pieces=splitPieces(slice,12), d=(e-s)/pieces.length;
      pieces.forEach(function(g,k){out.push({start:s+k*d,end:s+(k+1)*d,text:g});});
    }
    if(wi<totalW&&out.length)out[out.length-1].text+=" "+words.slice(wi).join(" ");
    if(!out.length){status("배치 실패 — 대본/음성을 확인하세요.");return;}
    subs=out; subsToBox(); renderPreview();
    status("✅ 대본으로 자막 교체 완료! (음성 타이밍 유지, 오타 없음)");
  }
  function subsToBox(){ $("subsBox").value=subs.map(function(x){return x.text;}).join("\n"); $("subsInfo").textContent="자막 "+subs.length+"개 · 총 "+fmt(totalDur()); }
  $("subsBox").addEventListener("input",function(){ var lines=$("subsBox").value.split("\n"); for(var i=0;i<subs.length&&i<lines.length;i++){subs[i].text=lines[i].trim();} renderPreview(); });

  async function transcribeAudio(){
    if(!audioFile){status("먼저 음성 파일을 넣으세요.");return;}
    var btn=$("transcribeBtn"); btn.disabled=true;
    try{
      status("AI 자막 엔진 로딩중... (처음 1회는 모델 다운로드로 시간이 걸려요)");
      var mod=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3");
      var transcriber=await mod.pipeline("automatic-speech-recognition","Xenova/whisper-base",{progress_callback:function(p){if(p&&p.status==="progress"&&p.file){status("모델 다운로드 "+(p.progress?Math.round(p.progress):0)+"% · "+p.file);}}});
      status("음성 디코딩중...");
      var buf=await audioFile.arrayBuffer();
      var ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
      var dec=await ac.decodeAudioData(buf);
      var data=dec.getChannelData(0);
      status("자막 추출중... (음성 길이에 따라 걸립니다)");
      var out=await transcriber(data,{return_timestamps:true,chunk_length_s:30,stride_length_s:5,language:"korean",task:"transcribe"});
      rawChunks=out.chunks||[];
      subs=buildSubs(out);
      if(!subs.length){status("자막을 못 뽑았어요. 음성이 또렷한지 확인하세요.");btn.disabled=false;return;}
      subsToBox();
      if(!imgSlots.length)buildSlots(); else updateInfo();
      renderPreview();
      if($("scriptBox").value.trim()){
        applyScript(); // 대본이 이미 있으면 바로 오타 없는 자막으로 교체
      } else {
        status("✅ 타이밍 추출 완료! 이제 ②에 정확한 대본을 붙여넣고 ③을 누르면 오타가 사라집니다.");
      }
    }catch(err){ status("자막 생성 실패: "+err.message+" (인터넷/크롬 확인)"); }
    btn.disabled=false;
  }

  function wireAudio(){
    if(!audioEl)return null;
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    if(!audioEl._wired){var src=actx.createMediaElementSource(audioEl);audioEl._dest=actx.createMediaStreamDestination();src.connect(audioEl._dest);src.connect(actx.destination);audioEl._wired=true;}
    return audioEl._dest.stream.getAudioTracks()[0];
  }

  // ---- 재생 / 저장 ----
  function run(record){
    if(playing||!imgSlots.length)return; playing=true; exporting=true;
    var rb=$("recordBtn"),pb=$("playBtn"); rb.disabled=true; pb.disabled=true;
    var dur=totalDur(), useAudio=audioEl&&isFinite(audioEl.duration)&&audioEl.duration>0;
    var recorder=null,chunks=[];
    if(record){
      try{
        var vs=canvas.captureStream(30), tracks=vs.getVideoTracks();
        if(useAudio){var at=wireAudio();if(at)tracks.push(at);}
        var stream=new MediaStream(tracks);
        var mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm";
        recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
        recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data);};
        recorder.onstop=function(){var blob=new Blob(chunks,{type:"video/webm"});var a=document.createElement("a");a.download="ssul-short.webm";a.href=URL.createObjectURL(blob);a.click();};
        recorder.start();
      }catch(err){status("저장 시작 실패: "+err.message);}
    } else if(useAudio){ wireAudio(); }
    if(useAudio){try{audioEl.currentTime=0;audioEl.play();}catch(e){}}
    var start=performance.now();
    function stop(){if(recorder)try{recorder.stop();}catch(e){} if(useAudio)try{audioEl.pause();}catch(e){} playing=false;exporting=false;rb.disabled=false;pb.disabled=false;renderPreview();}
    function loop(now){var t=(now-start)/1000; if(t>=dur||(useAudio&&audioEl.ended)){stop();return;} renderAt(t); requestAnimationFrame(loop);}
    requestAnimationFrame(loop);
  }

  ["titleLine1","titleLine2","channelName"].forEach(function(id){$(id).addEventListener("input",renderPreview);});
  $("transcribeBtn").addEventListener("click",transcribeAudio);
  $("applyScript").addEventListener("click",applyScript);
  $("buildSlots").addEventListener("click",buildSlots);
  $("applyUrls").addEventListener("click",applyUrls);
  $("fetchAll").addEventListener("click",fetchAll);
  $("prev").addEventListener("click",function(){previewIdx--;renderPreview();});
  $("next").addEventListener("click",function(){previewIdx++;renderPreview();});
  $("playBtn").addEventListener("click",function(){run(false);});
  $("recordBtn").addEventListener("click",function(){run(true);});
  $("pngBtn").addEventListener("click",function(){exporting=true;renderPreview();try{var a=document.createElement("a");a.download="frame.png";a.href=canvas.toDataURL("image/png");a.click();status("이미지 저장 완료 ✅");}catch(e){status("PNG 저장 실패: "+e.message);}exporting=false;renderPreview();});

  buildSlots(); // 초기 8칸
})();
</script>
</body>
</html>
