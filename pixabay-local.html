<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>썰 슬라이드 숏폼 생성기 (픽사베이 자동)</title>
<style>
  :root{--bg:#0e0f13;--panel:#191b21;--border:#2a2e38;--text:#e8eaed;--muted:#9aa0aa;--accent:#ffd400;--accent-ink:#14161b;--info:#4da3ff;--input-bg:#101319;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 56px;}
  header h1{margin:0;font-size:22px;}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px;}
  .layout{display:grid;grid-template-columns:420px 1fr;gap:24px;margin-top:20px;align-items:start;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;}
  fieldset{border:1px solid var(--border);border-radius:10px;margin:0 0 14px;padding:12px 14px 4px;}
  legend{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 6px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  input[type="text"],input[type="password"],input[type="file"],textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .slide{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--input-bg);}
  .slide .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .slide .del{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px;}
  .slide .thumb{width:100%;height:70px;object-fit:cover;border-radius:7px;margin-bottom:8px;display:none;border:1px solid var(--border);}
  button{cursor:pointer;font-family:inherit;}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btns button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:15px;}
  .primary{background:var(--accent);color:var(--accent-ink);}
  .secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .secondary:hover{border-color:var(--accent);}
  button:disabled{opacity:.5;cursor:default;}
  .addbtn{width:100%;padding:10px;border:1px dashed var(--border);background:transparent;color:var(--text);border-radius:10px;font-size:14px;margin-bottom:12px;}
  .fetchbtn{background:var(--info);color:#fff;border:none;border-radius:9px;padding:9px;width:100%;font-weight:700;font-size:14px;margin-bottom:12px;}
  .sfetch{background:transparent;border:1px solid var(--info);color:var(--info);border-radius:7px;padding:5px 10px;font-size:12px;}
  .preview{display:flex;flex-direction:column;align-items:center;gap:12px;}
  #canvas{width:100%;max-width:360px;aspect-ratio:9/16;height:auto;border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.4);background:#000;}
  .nav{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;}
  .nav button{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;}
  .hint{font-size:12px;color:var(--muted);margin:4px 2px 0;}
  #status{font-size:13px;color:var(--accent);min-height:18px;margin:6px 2px;}
  a{color:var(--info);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>썰 슬라이드 숏폼 생성기 <span style="font-size:13px;color:var(--muted)">· 픽사베이 자동</span></h1>
    <p>대본을 넣고 "이미지 자동 가져오기"를 누르면 문장별로 픽사베이 사진을 자동으로 채웁니다. (이 파일은 내 컴퓨터에서 직접 열어야 동작해요)</p>
  </header>
  <div class="layout">
    <section class="panel">
      <fieldset>
        <legend>픽사베이 API 키</legend>
        <div class="field">
          <label for="pixKey">API 키 (무료 · <a href="https://pixabay.com/api/docs/" target="_blank">발급받기</a>)</label>
          <input type="password" id="pixKey" placeholder="픽사베이에서 발급한 키 붙여넣기" />
        </div>
        <p class="hint">키는 이 브라우저에만 저장돼요(localStorage). 한 번 넣으면 다음에도 유지됩니다.</p>
      </fieldset>

      <fieldset>
        <legend>대본 → 슬라이드 자동 생성</legend>
        <div class="field">
          <label for="script">대본 (한 줄 = 슬라이드 1개)</label>
          <textarea id="script" rows="5">아빠 월급이 600인데 왜 우리집이 가난한지 이제 알았다
매달 카드값만 500이 나간다
알고 보니 아빠가 주식으로 다 날렸다</textarea>
        </div>
        <button type="button" class="primary" id="autoAll" style="width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:15px;margin-bottom:10px">🚀 대본으로 자동 완성 (슬라이드 + 이미지)</button>
        <button type="button" class="addbtn" id="buildFromScript">슬라이드만 만들기</button>
        <button type="button" class="fetchbtn" id="fetchAll">🔍 전체 이미지 다시 가져오기</button>
        <div id="status"></div>
      </fieldset>

      <fieldset>
        <legend>상단 제목 바</legend>
        <div class="field"><label for="titleLine1">1줄 (흰색)</label><input type="text" id="titleLine1" value="아빠가 월600" /></div>
        <div class="field"><label for="titleLine2">2줄 (노란 강조)</label><input type="text" id="titleLine2" value="벌어도 가난한 이유" /></div>
      </fieldset>

      <fieldset>
        <legend>슬라이드</legend>
        <div id="slides"></div>
        <button type="button" class="addbtn" id="addSlide">＋ 슬라이드 추가</button>
      </fieldset>

      <fieldset>
        <legend>하단 채널 바</legend>
        <div class="field"><label for="channelName">채널명</label><input type="text" id="channelName" value="@풀네임" /></div>
        <div class="field"><label for="footerTitle">하단 제목</label><input type="text" id="footerTitle" value="아빠가 월 600 벌어도 가난한 이유" /></div>
        <div class="field"><label for="playCaption">재생 캡션 (▶)</label><input type="text" id="playCaption" value="회사 경리한테 비타500 받은 사람" /></div>
      </fieldset>

      <fieldset>
        <legend>음성 / 길이</legend>
        <div class="field"><label for="audioInput">나레이션 음성 (mp3 · 선택)</label><input type="file" id="audioInput" accept="audio/*" /></div>
        <div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="syncAudio" checked style="width:auto" /> 오디오 길이에 맞춰 슬라이드 자동 분배</label></div>
        <div id="audioInfo" class="hint">음성을 넣으면 슬라이드가 음성 길이에 맞춰 자동으로 나뉘고, 녹화 영상에 소리도 함께 들어갑니다.</div>
      </fieldset>

      <div class="btns">
        <button type="button" class="secondary" id="playBtn">▶ 재생 미리보기</button>
        <button type="button" class="secondary" id="recordBtn">● 영상 녹화 (webm)</button>
        <button type="button" class="primary" id="pngBtn">현재 슬라이드 PNG</button>
      </div>
    </section>
    <section class="preview">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="nav">
        <button type="button" id="prev">◀</button>
        <span id="navLabel">슬라이드 1</span>
        <button type="button" id="next">▶</button>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";
  var W=1080,H=1920,TOP=250,BOT=300,MIDBOT=H-BOT;
  var canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
  var $=function(id){return document.getElementById(id);};
  var slides=[], previewIdx=0, playing=false;
  var audioEl=null, actx=null;

  // API 키 저장/복원
  try{ var saved=localStorage.getItem("pixKey"); if(saved)$("pixKey").value=saved; }catch(e){}
  $("pixKey").addEventListener("input",function(){ try{localStorage.setItem("pixKey",$("pixKey").value.trim());}catch(e){} });

  function num(el,d){var v=parseFloat(el.value);return isNaN(v)?d:v;}
  function status(m){$("status").textContent=m;}
  function wrap(text,maxW){
    var out=[]; (text||"").split("\n").forEach(function(para){
      var words=para.split(/(\s+)/),cur="";
      for(var i=0;i<words.length;i++){var t=cur+words[i];
        if(ctx.measureText(t).width>maxW&&cur.trim()!==""){out.push(cur.trimEnd());cur=words[i].replace(/^\s+/,"");}
        else cur=t;}
      out.push(cur.trimEnd());
    }); return out;
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function drawContain(img,bx,by,bw,bh){
    var iw=img.width,ih=img.height; if(!iw||!ih)return;
    var r=Math.min(bw/iw,bh/ih), w=iw*r, h=ih*r;
    ctx.drawImage(img,bx+(bw-w)/2,by+(bh-h)/2,w,h);
  }
  // 자막: 검은 바탕 + 노란 텍스트, bottomY를 바닥 기준으로 위로 쌓음 (여러 줄 지원)
  function captionBar(text,bottomY){
    if(!text)return;
    ctx.font="800 52px system-ui, sans-serif"; ctx.textAlign="center";
    var lines=wrap(text,W-160), lh=64, padX=26, padY=14, maxw=0;
    lines.forEach(function(l){maxw=Math.max(maxw,ctx.measureText(l).width);});
    var bw=maxw+padX*2, bh=lines.length*lh+padY*2, bx=(W-bw)/2, by=bottomY-bh;
    ctx.fillStyle="rgba(0,0,0,0.85)"; roundRect(bx,by,bw,bh,12); ctx.fill();
    ctx.fillStyle="#ffe000"; var ty=by+padY+lh*0.72;
    lines.forEach(function(l){ctx.fillText(l,W/2,ty);ty+=lh;});
  }

  function renderSlide(s){
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#000000"; ctx.fillRect(0,0,W,TOP);
    var t1=$("titleLine1").value.trim(), t2=$("titleLine2").value.trim();
    ctx.textAlign="center"; ctx.font="800 78px system-ui, sans-serif";
    ctx.fillStyle="#ffffff"; if(t1) ctx.fillText(t1,W/2,104);
    if(t2){ var tw=ctx.measureText(t2).width, bw=tw+44, bx=(W-bw)/2;
      ctx.fillStyle="#ffe000"; roundRect(bx,150,bw,88,10); ctx.fill();
      ctx.fillStyle="#111"; ctx.fillText(t2,W/2,212); }

    var body=s?s.body().trim():"", caption=s?s.caption().trim():"";
    var yBody=TOP+80;
    if(body){ ctx.textAlign="left"; ctx.font="600 46px system-ui, sans-serif"; ctx.fillStyle="#2a2a2a";
      var lines=wrap(body,W-140); for(var i=0;i<lines.length;i++){ctx.fillText(lines[i],70,yBody);yBody+=62;} }
    var imgTop=yBody+20, imgBot=MIDBOT-20;
    if(s&&s.img&&imgBot-imgTop>120){ drawContain(s.img,70,imgTop,W-140,imgBot-imgTop); }
    else if(!(s&&s.img)){ ctx.textAlign="center"; ctx.fillStyle="#c8ccd2"; ctx.font="500 34px system-ui, sans-serif";
      ctx.fillText("이미지 자동 가져오기를 누르세요",W/2,(imgTop+imgBot)/2); }
    // 자막을 이미지 하단에 얹기 (검은 바탕 · 노란 글씨)
    captionBar(caption, MIDBOT-30);

    ctx.fillStyle="#000000"; ctx.fillRect(0,MIDBOT,W,BOT);
    var avX=44,avY=MIDBOT+34,avD=64;
    var ag=ctx.createLinearGradient(avX,avY,avX+avD,avY+avD);ag.addColorStop(0,"#6bd36b");ag.addColorStop(1,"#2f9e2f");
    ctx.save();ctx.beginPath();ctx.arc(avX+avD/2,avY+avD/2,avD/2,0,Math.PI*2);ctx.closePath();ctx.clip();
    ctx.fillStyle=ag;ctx.fillRect(avX,avY,avD,avD);ctx.restore();
    ctx.textAlign="left"; ctx.fillStyle="#fff"; ctx.font="700 34px system-ui, sans-serif";
    var cn=$("channelName").value.trim(); ctx.fillText(cn,avX+avD+18,MIDBOT+78);
    var cnw=ctx.measureText(cn).width, bx=avX+avD+18+cnw+22, bw=110, bh=52, by=MIDBOT+40;
    ctx.fillStyle="#3a86ff"; roundRect(bx,by,bw,bh,26); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="700 28px system-ui, sans-serif"; ctx.textAlign="center"; ctx.fillText("가입",bx+bw/2,by+36);
    ctx.textAlign="left"; ctx.fillStyle="#e6e6e6"; ctx.font="400 30px system-ui, sans-serif";
    ctx.fillText($("footerTitle").value.trim(),44,MIDBOT+160);
    ctx.strokeStyle="rgba(255,255,255,.15)"; ctx.beginPath();ctx.moveTo(44,MIDBOT+195);ctx.lineTo(W-44,MIDBOT+195);ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="600 32px system-ui, sans-serif"; ctx.fillText("▶ "+$("playCaption").value.trim(),44,MIDBOT+250);
  }
  function renderPreview(){
    if(!slides.length){renderSlide(null);$("navLabel").textContent="슬라이드 0";return;}
    if(previewIdx>=slides.length)previewIdx=slides.length-1; if(previewIdx<0)previewIdx=0;
    renderSlide(slides[previewIdx]); $("navLabel").textContent="슬라이드 "+(previewIdx+1)+" / "+slides.length;
  }

  function addSlide(pre){
    pre=pre||{}; var idx=slides.length;
    var el=document.createElement("div"); el.className="slide";
    el.innerHTML=
      '<div class="shead"><b>슬라이드 '+(idx+1)+'</b><button type="button" class="del">삭제</button></div>'+
      '<img class="thumb" />'+
      '<div class="field"><label>본문</label><textarea rows="2" class="s-body">'+(pre.body||"")+'</textarea></div>'+
      '<div class="field"><label>검색어 (비우면 본문으로 검색 · 영어가 더 잘 나와요)</label><input type="text" class="s-q" value="'+(pre.q||"")+'"></div>'+
      '<div class="row"><div class="field"><label>자막 (하단·검정/노랑)</label><input type="text" class="s-cap" value="'+(pre.cap||"")+'"></div>'+
      '<div class="field"><label>길이(초)</label><input type="text" class="s-dur" value="'+(pre.dur||"2.5")+'"></div></div>'+
      '<button type="button" class="sfetch">이 슬라이드 이미지 가져오기</button>';
    $("slides").appendChild(el);
    var obj={ el:el, img:null,
      body:function(){return el.querySelector(".s-body").value;},
      caption:function(){return el.querySelector(".s-cap").value;},
      query:function(){return el.querySelector(".s-q").value.trim();},
      dur:function(){return num(el.querySelector(".s-dur"),2.5);},
      setImg:function(im){obj.img=im; var th=el.querySelector(".thumb"); th.src=im.src; th.style.display="block";} };
    el.querySelector(".s-body").addEventListener("input",renderPreview);
    el.querySelector(".s-cap").addEventListener("input",renderPreview);
    el.querySelector(".del").addEventListener("click",function(){var i=slides.indexOf(obj);if(i>=0)slides.splice(i,1);el.remove();renumber();renderPreview();});
    el.querySelector(".sfetch").addEventListener("click",function(){fetchForSlide(obj);});
    slides.push(obj); renumber(); previewIdx=slides.length-1; renderPreview();
    return obj;
  }
  function renumber(){var els=$("slides").querySelectorAll(".slide");for(var i=0;i<els.length;i++)els[i].querySelector("b").textContent="슬라이드 "+(i+1);}

  // ---- 픽사베이 ----
  function pixabaySearch(q){
    var key=$("pixKey").value.trim();
    if(!key) return Promise.reject(new Error("NO_KEY"));
    var url="https://pixabay.com/api/?key="+encodeURIComponent(key)+"&q="+encodeURIComponent(q)+"&image_type=photo&orientation=vertical&per_page=8&safesearch=true&order=popular&lang=ko";
    return fetch(url).then(function(r){ if(!r.ok)throw new Error("API_"+r.status); return r.json(); })
      .then(function(j){ if(!j.hits||!j.hits.length)return null; return (j.hits[0].largeImageURL||j.hits[0].webformatURL); });
  }
  function loadImage(u){
    return fetch(u).then(function(r){return r.blob();}).then(function(b){
      var ou=URL.createObjectURL(b);
      return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=rej;im.src=ou;});
    }).catch(function(){
      return new Promise(function(res,rej){var im=new Image();im.crossOrigin="anonymous";im.onload=function(){res(im);};im.onerror=rej;im.src=u;});
    });
  }
  function fetchForSlide(obj){
    var base=obj.query()||obj.caption()||obj.body();
    var q=obj.query()|| base.split("\n")[0].split(" ").slice(0,3).join(" ");
    if(!q){status("검색어가 없습니다.");return Promise.resolve();}
    status("'"+q+"' 검색 중...");
    return pixabaySearch(q).then(function(url){
      if(!url){status("'"+q+"' 결과 없음 — 검색어를 바꿔보세요.");return;}
      return loadImage(url).then(function(im){obj.setImg(im);renderPreview();status("완료: "+q);});
    }).catch(function(e){
      if(e.message==="NO_KEY")status("먼저 픽사베이 API 키를 입력하세요.");
      else status("오류: "+e.message+" (키 확인 또는 이 파일을 로컬에서 열었는지 확인)");
    });
  }
  function fetchAll(){
    if(!slides.length){status("슬라이드가 없습니다.");return;}
    var i=0;
    function next(){ if(i>=slides.length){status("전체 완료 ✅");return;}
      status("("+(i+1)+"/"+slides.length+") 가져오는 중...");
      fetchForSlide(slides[i]).then(function(){i++;setTimeout(next,300);}); }
    next();
  }

  function buildFromScript(){
    var lines=$("script").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
    if(!lines.length){status("대본이 비어있어요.");return;}
    $("slides").innerHTML=""; slides=[];
    lines.forEach(function(l){ addSlide({cap:l,dur:"2.5"}); });
    previewIdx=0; renderPreview(); updateAudioInfo(); status(lines.length+"개 슬라이드 생성 — 이제 '전체 이미지 자동 가져오기'를 누르세요.");
  }

  // 오디오
  function fmt(s){s=Math.round(s);return Math.floor(s/60)+"분 "+(s%60)+"초";}
  function updateAudioInfo(){
    if(audioEl&&isFinite(audioEl.duration)){
      var per=slides.length?audioEl.duration/slides.length:0;
      $("audioInfo").textContent="음성 길이 "+fmt(audioEl.duration)+" · 슬라이드 "+slides.length+"개 → 컷당 약 "+per.toFixed(1)+"초 (자동 분배)";
    }
  }
  $("audioInput").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    audioEl=new Audio(); audioEl.src=URL.createObjectURL(f); audioEl._wired=false;
    audioEl.addEventListener("loadedmetadata",updateAudioInfo);
  });
  // 오디오를 캔버스 녹화 스트림에 연결 (소리 포함 + 스피커 출력)
  function wireAudio(){
    if(!audioEl)return null;
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    if(!audioEl._wired){
      var src=actx.createMediaElementSource(audioEl);
      audioEl._dest=actx.createMediaStreamDestination();
      src.connect(audioEl._dest); src.connect(actx.destination);
      audioEl._wired=true;
    }
    return audioEl._dest.stream.getAudioTracks()[0];
  }

  // 재생/녹화
  function run(record){
    if(playing||!slides.length)return; playing=true;
    var rb=$("recordBtn"),pb=$("playBtn"); rb.disabled=true; pb.disabled=true;
    var useAudio = audioEl && isFinite(audioEl.duration) && audioEl.duration>0;
    var sync = useAudio && $("syncAudio").checked;
    var perSlide = sync ? audioEl.duration/slides.length : 0;

    var recorder=null,chunks=[];
    if(record){
      try{
        var vstream=canvas.captureStream(30);
        var tracks=vstream.getVideoTracks();
        if(useAudio){ var at=wireAudio(); if(at)tracks.push(at); }
        var stream=new MediaStream(tracks);
        var mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":"video/webm";
        recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
        recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data);};
        recorder.onstop=function(){var blob=new Blob(chunks,{type:"video/webm"});var a=document.createElement("a");a.download="ssul-short.webm";a.href=URL.createObjectURL(blob);a.click();};
        recorder.start();
      }catch(err){status("녹화 시작 실패: "+err.message);}
    } else if(useAudio){ wireAudio(); }

    if(useAudio){ try{audioEl.currentTime=0; audioEl.play();}catch(e){} }
    var idx=0,start=performance.now();
    function stop(){ if(recorder)try{recorder.stop();}catch(e){} if(useAudio)try{audioEl.pause();}catch(e){} playing=false;rb.disabled=false;pb.disabled=false;renderPreview(); }
    function loop(now){
      if(idx>=slides.length || (useAudio && audioEl.ended)){ stop(); return; }
      try{ renderSlide(slides[idx]); }
      catch(err){ status("녹화 중 오류(이미지 보안 문제일 수 있음): "+err.message); }
      var d = sync ? perSlide : slides[idx].dur();
      if((now-start)/1000>=d){idx++;start=now;}
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  ["titleLine1","titleLine2","channelName","footerTitle","playCaption"].forEach(function(id){$(id).addEventListener("input",renderPreview);});
  $("buildFromScript").addEventListener("click",buildFromScript);
  $("fetchAll").addEventListener("click",fetchAll);
  $("autoAll").addEventListener("click",function(){ buildFromScript(); setTimeout(fetchAll,200); });
  $("addSlide").addEventListener("click",function(){addSlide({});});
  $("prev").addEventListener("click",function(){previewIdx--;renderPreview();});
  $("next").addEventListener("click",function(){previewIdx++;renderPreview();});
  $("playBtn").addEventListener("click",function(){run(false);});
  $("recordBtn").addEventListener("click",function(){run(true);});
  $("pngBtn").addEventListener("click",function(){renderPreview();try{var a=document.createElement("a");a.download="slide.png";a.href=canvas.toDataURL("image/png");a.click();}catch(e){status("PNG 저장 실패(이미지 보안 문제): "+e.message);}});

  buildFromScript();
})();
</script>
